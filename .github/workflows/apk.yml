# Compila el APK en los servidores de GitHub, que ya traen el SDK de Android.
# No hace falta instalar nada en tu computadora.
#
# Para usarlo: subí este proyecto a un repositorio de GitHub. El APK queda en
# la pestaña "Actions" → último run → "Artifacts" → mis-gastos-apk.

name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write        # necesario para publicar el APK como Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'      # Capacitor 7 necesita Java 21

      # v4 con los paquetes explícitos. El default de v3 incluía 'tools',
      # un paquete que Google sacó del repositorio, y la acción moría ahí.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Clave de firma propia (secretos del repositorio). Si están cargados se
      # compila el APK de release firmado con ella: es la forma estable de que
      # las actualizaciones entren encima sin perder datos. Si no están, se
      # cae al modo anterior (clave de debug cacheada), que es frágil.
      - name: Preparar la clave de firma
        id: firma
        env:
          KS_B64: ${{ secrets.MG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin clave propia: se firma con la clave de debug (frágil)."
          fi

      - name: Conservar la clave de debug (solo modo sin clave propia)
        if: steps.firma.outputs.release == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: misgastos-debug-keystore-v1

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar
        env:
          MG_KEYSTORE: ${{ steps.firma.outputs.release == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          MG_STORE_PASS: ${{ secrets.MG_STORE_PASS }}
          MG_KEY_ALIAS: ${{ secrets.MG_KEY_ALIAS }}
          MG_KEY_PASS: ${{ secrets.MG_KEY_PASS }}
        run: |
          chmod +x android/gradlew
          cd android
          if [ "${{ steps.firma.outputs.release }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../mis-gastos.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../mis-gastos.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mis-gastos-apk
          path: mis-gastos.apk
          if-no-files-found: error

      # Release con el .apk suelto y SIEMPRE con el mismo nombre, así el link
      # .../releases/latest/download/mis-gastos.apk no cambia nunca.
      - name: Publicar el APK para bajar del celular
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" mis-gastos.apk \
            --title "Mis Gastos — build ${{ github.run_number }}" \
            --notes "Abrilo desde el celular para instalar."
